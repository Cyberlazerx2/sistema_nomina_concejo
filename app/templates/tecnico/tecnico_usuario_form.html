<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generar Credenciales - Técnico de Informática</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 550px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h2 { color: #2c3e50; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #333; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 18px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: #0056b3; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Crear Cuenta de Usuario</h2>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">
                * Procedimiento administrativo de soporte informático. La cuenta se ligará a la ficha del funcionario y quedará auditada en bitácora.
            </p>

            <form method="POST">
                <div class="form-group">
                    <label>Funcionario a Vincular:</label>
                    <select name="trabajador_id" required>
                        <option value="">Seleccione funcionario...</option>
                        {% for t in trabajadores %}
                            <option value="{{ t.trabajador_id }}" {% if trabajador_id_param and trabajador_id_param|int == t.trabajador_id %}selected{% endif %}>
                                {{ t.cedula }} - {{ t.apellidos }} {{ t.nombres }} ({{ t.cargo_nombre }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Nombre de Usuario (Login):</label>
                    <input type="text" name="nombre_usuario" required placeholder="ej: nombre.apellido">
                </div>

                <div class="form-group">
                    <label>Contraseña Temporal:</label>
                    <input type="password" name="clave" required placeholder="Ingrese contraseña temporal segura">
                </div>

                <div class="form-group">
                    <label>Rol de Acceso:</label>
                    <select name="rol_id" required>
                        {% for r in roles %}
                            <option value="{{ r.rol_id }}" {% if r.nombre == 'trabajador' %}selected{% endif %}>
                                {{ r.nombre }} - {{ r.descripcion }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">Registrar Usuario</button>
                    <a href="{{ url_for('tecnico.usuarios') }}" class="btn btn-secondary" style="margin-left: 10px;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
