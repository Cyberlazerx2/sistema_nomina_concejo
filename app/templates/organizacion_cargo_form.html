<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Nuevo Cargo' if modo == 'crear' else 'Editar Cargo' }} - Concejo Municipal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h2 { color: #2c3e50; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #333; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 9px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-success { background: #27ae60; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>{{ 'Registrar Nuevo Cargo' if modo == 'crear' else 'Editar Cargo' }}</h2>
            <form method="POST">
                <div class="form-group">
                    <label>Nombre del Cargo:</label>
                    <input type="text" name="nombre" value="{{ cargo.nombre if cargo else '' }}" required placeholder="ej: Coordinador de Presupuesto">
                </div>

                <div class="form-group">
                    <label>Departamento de Adscripción:</label>
                    <select name="departamento_id" required>
                        {% for d in departamentos %}
                            <option value="{{ d.departamento_id }}" {% if cargo and cargo.departamento_id == d.departamento_id %}selected{% endif %}>
                                {{ d.nombre }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Sueldo Base Mensual de Referencia (Bs.):</label>
                    <input type="number" step="0.01" name="sueldo_base" value="{{ cargo.sueldo_base if cargo else '' }}" required placeholder="0.00">
                </div>

                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-success">Guardar Cargo</button>
                    <a href="{{ url_for('organizacion.cargos') }}" class="btn btn-secondary" style="margin-left: 10px;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
