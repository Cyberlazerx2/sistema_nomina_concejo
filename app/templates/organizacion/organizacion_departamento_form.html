<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Departamento - Concejo Municipal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h2 { color: #2c3e50; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #333; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 9px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-success { background: #27ae60; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Crear Departamento</h2>
            <form method="POST">
                <div class="form-group">
                    <label>Nombre de la Dependencia:</label>
                    <input type="text" name="nombre" required placeholder="ej: Auditoría Interna">
                </div>
                <div>
                    <button type="submit" class="btn btn-success">Guardar Dependencia</button>
                    <a href="{{ url_for('organizacion.departamentos') }}" class="btn btn-secondary" style="margin-left: 10px;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
