<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Nuevo Trabajador' if modo == 'crear' else 'Editar Expediente' }} - Concejo Municipal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h2 { color: #2c3e50; margin-top: 0; }
        .form-row { display: flex; gap: 15px; margin-bottom: 12px; }
        .form-group { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #333; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 18px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-success { background: #27ae60; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>{{ 'Registrar Nuevo Trabajador' if modo == 'crear' else 'Editar Expediente de Trabajador' }}</h2>
            <form method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label>Cédula de Identidad:</label>
                        <input type="text" name="cedula" value="{{ trabajador.cedula if trabajador else '' }}" required placeholder="V-12345678">
                    </div>
                    <div class="form-group">
                        <label>Nombres:</label>
                        <input type="text" name="nombres" value="{{ trabajador.nombres if trabajador else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label>Apellidos:</label>
                        <input type="text" name="apellidos" value="{{ trabajador.apellidos if trabajador else '' }}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Fecha de Nacimiento:</label>
                        <input type="date" name="fecha_nacimiento" value="{{ trabajador.fecha_nacimiento if trabajador else '' }}">
                    </div>
                    <div class="form-group">
                        <label>Sexo:</label>
                        <select name="sexo" required>
                            <option value="M" {% if trabajador and trabajador.sexo == 'M' %}selected{% endif %}>Masculino</option>
                            <option value="F" {% if trabajador and trabajador.sexo == 'F' %}selected{% endif %}>Femenino</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Teléfono:</label>
                        <input type="text" name="telefono" value="{{ trabajador.telefono if trabajador else '' }}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Correo Electrónico:</label>
                        <input type="email" name="correo" value="{{ trabajador.correo if trabajador else '' }}">
                    </div>
                    <div class="form-group">
                        <label>Dirección de Residencia:</label>
                        <input type="text" name="direccion" value="{{ trabajador.direccion if trabajador else '' }}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cargo Institucional:</label>
                        <select name="cargo_id" required>
                            {% for c in cargos %}
                                <option value="{{ c.cargo_id }}" {% if trabajador and trabajador.cargo_id == c.cargo_id %}selected{% endif %}>
                                    {{ c.nombre }} (Base Ref: Bs. {{ c.sueldo_base }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tipo de Nómina:</label>
                        <select name="tipo_personal" required>
                            {% for cod, nom in tipos_personal %}
                                <option value="{{ cod }}" {% if trabajador and trabajador.tipo_personal == cod %}selected{% endif %}>{{ nom }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Fecha de Ingreso:</label>
                        <input type="date" name="fecha_ingreso" value="{{ trabajador.fecha_ingreso if trabajador else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label>Sueldo Base Mensual (Bs.):</label>
                        <input type="number" step="0.01" name="sueldo_base" value="{{ trabajador.sueldo_base if trabajador else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label>Carga Familiar (Hijos):</label>
                        <input type="number" name="hijos" value="{{ trabajador.hijos if trabajador else 0 }}" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Nivel de Instrucción:</label>
                        <select name="nivel_instruccion" required>
                            {% for n in niveles %}
                                <option value="{{ n }}" {% if trabajador and trabajador.nivel_instruccion == n %}selected{% endif %}>{{ n }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Entidad Bancaria:</label>
                        <input type="text" name="banco" value="{{ trabajador.banco if trabajador else 'Banco de Venezuela' }}" required>
                    </div>
                    <div class="form-group">
                        <label>Número de Cuenta (20 Dígitos Patria):</label>
                        <input type="text" name="numero_cuenta" maxlength="30" value="{{ trabajador.numero_cuenta if trabajador else '' }}" required placeholder="01020000000000000000">
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-success">Guardar Expediente</button>
                    <a href="{{ url_for('trabajadores.listar') }}" class="btn btn-secondary" style="margin-left: 10px;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
